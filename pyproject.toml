[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funnylang"
version = "1.0.0"
description = "FunnyLang — a bytecode-compiled programming language that refuses to take itself seriously."
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pyinstaller"]

[project.scripts]
funny = "funnylang.cli:main"

[tool.setuptools.packages.find]
include = ["funnylang*"]

[tool.setuptools.package-data]
funnylang = ["py.typed"]
