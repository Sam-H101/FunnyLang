name: ci

on:
  # No filter on push (deliberately): every ordinary branch push runs the
  # full suite. Releases moved to their own workflow (release.yml) when the
  # PyInstaller path was replaced by the native build -- freezing CPython to
  # ship a binary stopped making sense once the runtime stopped being Python.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# release-build/release-publish need to create a GitHub Release and upload
# assets to it; everything else only needs default read access.
permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    # Everything below runs under bash on every runner so the flow is one
    # script rather than three dialects.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov pyinstaller

      # Editable install, not just the dev deps: tests/test_bootstrap.py runs
      # `python -m funnylang` from a tmp_path cwd, so the repo root is not on
      # sys.path and an uninstalled package is invisible there.
      - name: Install the package
        run: python -m pip install -e .

      # `python -m pytest` (not bare `pytest`) so the repo root lands on
      # sys.path -- tests/test_cli.py and friends shell out to
      # `python -m funnylang`. FUNNY_NO_NET keeps the `internet` stdlib
      # module's tests hermetic in CI.
      - name: Run the test suite
        env:
          FUNNY_NO_NET: "1"
        run: python -m pytest -q

      # The self-hosting fixed point: the FunnyLang compiler written in
      # FunnyLang (selfhost/) must reproduce itself byte for byte.
      - name: Verify self-hosting bootstrap
        run: python -m funnylang bootstrap --verify

      # Freeze a real standalone executable and prove it runs with no Python
      # on its PATH assumptions beyond what's baked into the stub.
      - name: Build a native executable
        run: python -m funnylang yeet examples/hello.funny -o hello-exe/hello

      # `-o` is used literally, with no platform-specific extension appended
      # (that only happens when `-o` is omitted), so the output file is
      # exactly `hello-exe/hello` on every OS.
      - name: Run the frozen executable
        shell: bash
        run: |
          chmod +x ./hello-exe/hello
          ./hello-exe/hello

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: funnylang-hello-${{ matrix.os }}-py${{ matrix.python-version }}
          path: hello-exe/
          retention-days: 7

  native:
    # NATIVE_PLAN.md N0: proves the C toolchain builds native/*.c clean, with
    # -Werror, on all three OSes -- MSVC on Windows, gcc/clang (whichever
    # `cc` resolves to) on Linux/macOS. Since N2, also runs the differential
    # test suite (tests/native/) against the Python VM on Linux/macOS --
    # not Windows yet, since that suite invokes `cc` directly (with gcc/
    # clang-style flags) rather than going through build.bat's MSVC-specific
    # invocation, so it just skips itself there for now (see test_n2_
    # differential.py's own FileNotFoundError handling).
    name: native (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # N9 task 4: both compilers on each POSIX runner, not just whatever
        # `cc` resolves to -- gcc and clang disagree about enough warnings
        # that -Werror only means something if both have seen the code.
        include:
          - { os: windows-latest, cc: msvc }
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          # No macos+gcc entry: on a GitHub macOS runner `gcc` is a shim for
          # Apple clang, so it would build the same code with the same
          # compiler under a different name.
          - { os: macos-latest, cc: clang }

    env:
      CC: ${{ matrix.cc }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        if: runner.os != 'Windows'
        run: python -m pip install --upgrade pip pytest

      - name: Build (release)
        if: runner.os != 'Windows'
        run: ./build.sh

      - name: Build (release)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat

      - name: Run it (release)
        if: runner.os != 'Windows'
        run: ./funny

      - name: Run it (release)
        if: runner.os == 'Windows'
        shell: cmd
        run: funny.exe

      # The differential step below is POSIX-only, because tests/conftest.py's
      # native_binary fixture builds with gcc-style flags and `CC: msvc` makes
      # it skip. That left the Windows job proving only that the code compiles
      # and the binary starts -- and a real bug lived in that gap: the bundler
      # keyed every module by its *absolute path* on Windows, because
      # `filez.abs_path` returns '/' there while `filez.dir_of` returns '\',
      # so the "strip the entry directory" prefix test never matched. Bundles
      # stopped being reproducible across platforms and `yeet`ed executables
      # leaked the builder's directory layout into their diagnostics.
      #
      # The golden corpus needs no Python and catches exactly that class of
      # thing, so it runs on Windows too. N11 makes this the *only* kind of
      # test step; it is here early because the hole is here now.
      - name: Golden corpus (release)
        if: runner.os == 'Windows'
        shell: cmd
        run: funny.exe test tests/lang

      - name: Bootstrap fixed point (release)
        if: runner.os == 'Windows'
        shell: cmd
        run: funny.exe bootstrap --verify

      # Builds its own native binary from native/*.c directly (not the
      # ./funny from the step above) and diffs its output against the real
      # Python VM -- NATIVE_PLAN.md N2's actual acceptance gate, not just
      # "did it compile."
      - name: Differential test against the Python VM
        if: runner.os != 'Windows'
        env:
          FUNNY_NO_NET: "1"
        run: python -m pytest tests/native/ -v

      - name: Differential test against the Python VM (under FUNNY_GC_STRESS)
        if: runner.os != 'Windows'
        env:
          FUNNY_NO_NET: "1"
          FUNNY_GC_STRESS: "1"
        run: python -m pytest tests/native/ -v

      # ASan/UBSan (MSVC only has ASan -- see build.bat's own comment).
      # Nothing in main.c can trip either yet; this exists so the debug
      # build path itself is proven working before there's anything real
      # for it to catch.
      - name: Build (debug, sanitizers)
        if: runner.os != 'Windows'
        run: ./build.sh debug

      - name: Run it (debug)
        if: runner.os != 'Windows'
        run: ./funny

      - name: Build (debug, ASan)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat debug

      - name: Run it (debug)
        if: runner.os == 'Windows'
        shell: cmd
        run: funny.exe

  no-python:
    # NATIVE_PLAN.md N9 task 3 -- the single most important job here. A
    # container with a C compiler and *nothing else*: no Python, no pip, no
    # interpreter at all. If this passes, "FunnyLang needs no Python" is a
    # fact about the artifact rather than a claim in a README.
    #
    # `funnylang/` and every other .py file is deleted from the checkout
    # before anything runs, so an accidental dependency on the Python
    # implementation fails loudly instead of quietly working on a machine
    # that happens to have it.
    name: no-python (debian, cc only)
    runs-on: ubuntu-latest
    container: debian:12

    steps:
      - name: Install a C compiler and nothing else
        run: |
          apt-get update
          # git is for actions/checkout; on Debian it recommends perl, not
          # python, and --no-install-recommends keeps even that out.
          apt-get install -y --no-install-recommends gcc libc6-dev ca-certificates git
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Prove there is no Python here
        run: |
          set -eu
          for exe in python python3 python3.11 python3.12 pip pip3; do
            if command -v "$exe" >/dev/null 2>&1; then
              echo "FAIL: $exe is on PATH -- this job is meaningless with an interpreter available"
              exit 1
            fi
          done
          echo "no python, no pip."

      - name: Delete every .py file from the checkout
        run: |
          set -eu
          find . -name '*.py' -delete
          rm -rf funnylang
          if find . -name '*.py' | grep -q .; then echo "FAIL: a .py survived"; exit 1; fi
          echo "funnylang/ and every .py file are gone."

      - name: Build from C source alone
        run: ./build.sh

      - name: funny --version
        run: ./funny --version

      - name: Run a source file
        run: ./funny run examples/hello.funny

      - name: Run a multi-module program
        run: ./funny run examples/modules/main.funny

      - name: Build a bundle, then run it
        run: |
          ./funny build examples/modules/main.funny -o built.funnypak
          ./funny run built.funnypak

      - name: The golden corpus
        env:
          FUNNY_NO_NET: "1"
        run: |
          ./funny test tests/lang
          ./funny test examples

      - name: xray and fmt
        run: |
          ./funny xray examples/hello.funny
          ./funny xray examples/hello.funny --ast
          ./funny fmt examples/fizzbuzz.funny --check

      - name: Yeet a standalone binary, then run it
        run: |
          ./funny yeet examples/hello.funny -o hello_standalone
          ./hello_standalone

      # The REPL reads stdin, so it gets a scripted session rather than a tty.
      - name: The REPL
        run: printf 'yo x = 5\nx + 3\n.exit\n' | ./funny vibe

      - name: The self-hosting fixed point
        run: ./funny bootstrap --verify

      # Belt and braces: rerun the whole sequence with an *empty environment*
      # and no PATH at all, which also rules out shelling out to anything.
      - name: Again, with no PATH at all
        run: |
          set -eu
          env -i FUNNY_NO_NET=1 ./funny --version
          env -i FUNNY_NO_NET=1 ./funny run examples/hello.funny
          env -i FUNNY_NO_NET=1 ./funny test tests/lang
          env -i FUNNY_NO_NET=1 ./funny bootstrap --verify

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Exercises the real packaging path: pyproject metadata, the
      # packages-find config, and the `funny` console script landing on PATH.
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: funny --version
        run: funny --version

      # Runs every examples/*.funny that has a matching .expected and diffs
      # the output, via the installed script rather than `python -m funnylang`.
      - name: Run the example suite
        env:
          FUNNY_NO_NET: "1"
        run: funny test examples

      # A .funnypak must resolve its own imports with no filesystem access,
      # so build the module tree and run it from a directory where the
      # sources are not reachable by relative import.
      - name: Build and run a linked .funnypak
        run: |
          mkdir -p pak-out
          funny build examples/modules/main.funny -o pak-out/main.funnypak
          cd pak-out
          funny run main.funnypak

  # NATIVE_PLAN.md N0 task 6: an *interim* release, cut before any of the C
  # runtime exists, so a download here works today. This freezes the real
  # `funny` CLI (funnylang/__main__.py -- compiler, parser, VM, REPL, the
  # works) with PyInstaller, which is a different target than `funny yeet`
  # (packager.py's stub_main.py): `yeet` only ever runs one already-linked
  # program baked in at freeze time, which would make for a deeply
  # misleading "start writing FunnyLang" download. N10 replaces this whole
  # job wholesale once N1-N9 land and the C runtime can do the same job
  # without Python installed anywhere in the chain.
