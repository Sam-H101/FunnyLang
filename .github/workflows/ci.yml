name: ci

on:
  # No filter on push (deliberately): this must keep triggering on every
  # ordinary branch push, same as before -- a bare `push:` already covers
  # tag pushes too, which is all the release jobs below need (they gate
  # themselves on `startsWith(github.ref, 'refs/tags/v')`).
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# release-build/release-publish need to create a GitHub Release and upload
# assets to it; everything else only needs default read access.
permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    # Everything below runs under bash on every runner so the flow is one
    # script rather than three dialects.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov pyinstaller

      # Editable install, not just the dev deps: tests/test_bootstrap.py runs
      # `python -m funnylang` from a tmp_path cwd, so the repo root is not on
      # sys.path and an uninstalled package is invisible there.
      - name: Install the package
        run: python -m pip install -e .

      # `python -m pytest` (not bare `pytest`) so the repo root lands on
      # sys.path -- tests/test_cli.py and friends shell out to
      # `python -m funnylang`. FUNNY_NO_NET keeps the `internet` stdlib
      # module's tests hermetic in CI.
      - name: Run the test suite
        env:
          FUNNY_NO_NET: "1"
        run: python -m pytest -q

      # The self-hosting fixed point: the FunnyLang compiler written in
      # FunnyLang (selfhost/) must reproduce itself byte for byte.
      - name: Verify self-hosting bootstrap
        run: python -m funnylang bootstrap --verify

      # Freeze a real standalone executable and prove it runs with no Python
      # on its PATH assumptions beyond what's baked into the stub.
      - name: Build a native executable
        run: python -m funnylang yeet examples/hello.funny -o hello-exe/hello

      # `-o` is used literally, with no platform-specific extension appended
      # (that only happens when `-o` is omitted), so the output file is
      # exactly `hello-exe/hello` on every OS.
      - name: Run the frozen executable
        shell: bash
        run: |
          chmod +x ./hello-exe/hello
          ./hello-exe/hello

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: funnylang-hello-${{ matrix.os }}-py${{ matrix.python-version }}
          path: hello-exe/
          retention-days: 7

  native:
    # NATIVE_PLAN.md N0: proves the C toolchain builds native/*.c clean, with
    # -Werror, on all three OSes -- MSVC on Windows, gcc/clang (whichever
    # `cc` resolves to) on Linux/macOS. Since N2, also runs the differential
    # test suite (tests/native/) against the Python VM on Linux/macOS --
    # not Windows yet, since that suite invokes `cc` directly (with gcc/
    # clang-style flags) rather than going through build.bat's MSVC-specific
    # invocation, so it just skips itself there for now (see test_n2_
    # differential.py's own FileNotFoundError handling).
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        if: runner.os != 'Windows'
        run: python -m pip install --upgrade pip pytest

      - name: Build (release)
        if: runner.os != 'Windows'
        run: ./build.sh

      - name: Build (release)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat

      - name: Run it (release)
        if: runner.os != 'Windows'
        run: ./funny

      - name: Run it (release)
        if: runner.os == 'Windows'
        shell: cmd
        run: funny.exe

      # Builds its own native binary from native/*.c directly (not the
      # ./funny from the step above) and diffs its output against the real
      # Python VM -- NATIVE_PLAN.md N2's actual acceptance gate, not just
      # "did it compile."
      - name: Differential test against the Python VM
        if: runner.os != 'Windows'
        env:
          FUNNY_NO_NET: "1"
        run: python -m pytest tests/native/ -v

      - name: Differential test against the Python VM (under FUNNY_GC_STRESS)
        if: runner.os != 'Windows'
        env:
          FUNNY_NO_NET: "1"
          FUNNY_GC_STRESS: "1"
        run: python -m pytest tests/native/ -v

      # ASan/UBSan (MSVC only has ASan -- see build.bat's own comment).
      # Nothing in main.c can trip either yet; this exists so the debug
      # build path itself is proven working before there's anything real
      # for it to catch.
      - name: Build (debug, sanitizers)
        if: runner.os != 'Windows'
        run: ./build.sh debug

      - name: Run it (debug)
        if: runner.os != 'Windows'
        run: ./funny

      - name: Build (debug, ASan)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat debug

      - name: Run it (debug)
        if: runner.os == 'Windows'
        shell: cmd
        run: funny.exe

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Exercises the real packaging path: pyproject metadata, the
      # packages-find config, and the `funny` console script landing on PATH.
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: funny --version
        run: funny --version

      # Runs every examples/*.funny that has a matching .expected and diffs
      # the output, via the installed script rather than `python -m funnylang`.
      - name: Run the example suite
        env:
          FUNNY_NO_NET: "1"
        run: funny test examples

      # A .funnypak must resolve its own imports with no filesystem access,
      # so build the module tree and run it from a directory where the
      # sources are not reachable by relative import.
      - name: Build and run a linked .funnypak
        run: |
          mkdir -p pak-out
          funny build examples/modules/main.funny -o pak-out/main.funnypak
          cd pak-out
          funny run main.funnypak

  # NATIVE_PLAN.md N0 task 6: an *interim* release, cut before any of the C
  # runtime exists, so a download here works today. This freezes the real
  # `funny` CLI (funnylang/__main__.py -- compiler, parser, VM, REPL, the
  # works) with PyInstaller, which is a different target than `funny yeet`
  # (packager.py's stub_main.py): `yeet` only ever runs one already-linked
  # program baked in at freeze time, which would make for a deeply
  # misleading "start writing FunnyLang" download. N10 replaces this whole
  # job wholesale once N1-N9 land and the C runtime can do the same job
  # without Python installed anywhere in the chain.
  release-build:
    name: release-build (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            bin: funny.exe
            asset: funny-windows-x86_64.exe
          - os: ubuntu-latest
            target: linux-x86_64
            bin: funny
            asset: funny-linux-x86_64
          - os: macos-latest
            target: macos-arm64
            bin: funny
            asset: funny-macos-arm64

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      # Every stdlib module is loaded dynamically by name (same reason
      # packager.py's own PyInstaller invocation needs this), so PyInstaller's
      # static import scan needs an explicit nudge per module.
      - name: Freeze the funny CLI
        run: |
          mkdir -p dist-release
          HIDDEN=()
          for mod in mafs yapper stash groupchat rizz filez clock sus computer internet; do
            HIDDEN+=(--hidden-import "funnylang.stdlib.$mod")
          done
          python -m PyInstaller --onefile --name funny --console --noconfirm \
            --distpath dist-release "${HIDDEN[@]}" funnylang/__main__.py

      # Proves this is a real, general-purpose toolchain, not just a binary
      # that happens to print "hello" -- exactly N0's acceptance criterion.
      - name: Smoke test
        env:
          FUNNY_NO_NET: "1"
        run: |
          chmod +x "dist-release/${{ matrix.bin }}"
          "dist-release/${{ matrix.bin }}" --version
          "dist-release/${{ matrix.bin }}" run examples/hello.funny
          "dist-release/${{ matrix.bin }}" test examples

      - name: Rename to the release asset name
        run: mv "dist-release/${{ matrix.bin }}" "dist-release/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist-release/${{ matrix.asset }}
          retention-days: 90

  release-publish:
    name: release-publish
    needs: release-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Checksums
        working-directory: dist-release
        run: sha256sum * > SHA256SUMS

      - name: List what's about to be published
        run: ls -la dist-release

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist-release/*
          body: |
            Interim release (NATIVE_PLAN.md N0 task 6): the full `funny` CLI, frozen with
            PyInstaller. No native (C) runtime yet — that's N1-N9 — so these binaries bundle
            CPython and run ~8 MB, but they need no Python installed to use. Download the one
            for your OS, `chmod +x` it on Linux/macOS, and run `funny --version` to confirm it
            works, then `funny run yourfile.funny`.
