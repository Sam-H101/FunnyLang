name: ci

on:
  # No filter on push (deliberately): every ordinary branch push runs the
  # full suite. Releases live in their own workflow (release.yml).
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# NATIVE_PLAN.md N11 task 4: nothing here installs, invokes, or depends on
# Python. There used to be a `ci` job that ran a 1,313-test pytest suite and a
# `package` job that pip-installed the implementation; both went with
# `funnylang/` itself. What replaces them is the golden corpus -- 324
# `.funny`/`.expected` pairs run by `funny test`, which is FunnyLang -- and
# the bootstrap fixed point.
#
# The `no-python` job below is no longer the special case it was written as.
# It is kept anyway, because "there is no interpreter on this machine at all"
# is a stronger statement than "we did not happen to call one".

jobs:
  native:
    # Builds native/*.c clean with -Werror on all three OSes -- MSVC on
    # Windows, gcc and clang on Linux, clang on macOS -- and then runs
    # everything the toolchain can do with the binary it just built.
    name: native (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    # A ceiling, not an estimate: the whole job is minutes. If it is ever
    # anywhere near this, something has gone wrong and sitting there for six
    # hours helps nobody.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both compilers on the Linux runner, not just whatever `cc` resolves
        # to: gcc and clang disagree about enough warnings that -Werror only
        # means something if both have seen the code.
        include:
          - { os: windows-latest, cc: msvc }
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          # No macos+gcc entry: on a GitHub macOS runner `gcc` is a shim for
          # Apple clang, so it would build the same code with the same
          # compiler under a different name.
          - { os: macos-latest, cc: clang }

    env:
      CC: ${{ matrix.cc }}
      # The `internet` module's goldens are property checks, but nothing in
      # CI should reach the network to run them.
      FUNNY_NO_NET: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build (release)
        if: runner.os != 'Windows'
        run: ./build.sh

      - name: Build (release)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat

      # From here down the two branches differ only in `./funny` vs
      # `funny.exe`, so they are written once each rather than twice with a
      # shell shim. Everything runs on every platform: a Windows-only bug
      # lived for a while in the gap where these steps used to be POSIX-only
      # (the bundler keyed every module by its absolute path there), and two
      # more turned up the week the gap was closed.
      - name: Everything the toolchain does
        if: runner.os != 'Windows'
        run: |
          set -eu
          ./funny --version
          ./funny run examples/hello.funny
          ./funny run examples/modules/main.funny
          ./funny build examples/modules/main.funny -o built.funnypak
          ./funny run built.funnypak
          ./funny test tests/lang
          ./funny test tests/slow
          ./funny test examples
          # A whole HTTP server, driven over a real loopback socket by an
          # `interns` worker acting as the client. FUNNY_NO_NET is set for
          # these jobs and deliberately does not block loopback -- see
          # internet.c's own note on why.
          ./funny test extensive_examples
          ./funny xray examples/hello.funny
          ./funny xray examples/hello.funny --tokens
          ./funny xray examples/hello.funny --ast
          ./funny fmt examples/fizzbuzz.funny --check
          ./funny bootstrap --verify

      - name: Everything the toolchain does
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          funny.exe --version || exit /b 1
          funny.exe run examples\hello.funny || exit /b 1
          funny.exe run examples\modules\main.funny || exit /b 1
          funny.exe build examples\modules\main.funny -o built.funnypak || exit /b 1
          funny.exe run built.funnypak || exit /b 1
          funny.exe test tests\lang || exit /b 1
          funny.exe test tests\slow || exit /b 1
          funny.exe test examples || exit /b 1
          funny.exe test extensive_examples || exit /b 1
          funny.exe xray examples\hello.funny || exit /b 1
          funny.exe xray examples\hello.funny --tokens || exit /b 1
          funny.exe xray examples\hello.funny --ast || exit /b 1
          funny.exe fmt examples\fizzbuzz.funny --check || exit /b 1
          funny.exe bootstrap --verify || exit /b 1

      # A yeeted executable is the runtime stub plus a bundle, so it is the
      # one artifact whose correctness cannot be checked from inside the
      # language -- running it needs a process.
      - name: Yeet a standalone binary, then run it
        if: runner.os != 'Windows'
        run: |
          set -eu
          ./funny yeet examples/hello.funny -o hello_standalone
          ./hello_standalone

      - name: Yeet a standalone binary, then run it
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          funny.exe yeet examples\hello.funny -o hello_standalone.exe || exit /b 1
          hello_standalone.exe || exit /b 1

      # The REPL reads stdin, so it gets a scripted session rather than a tty.
      - name: The REPL
        if: runner.os != 'Windows'
        run: printf 'yo x = 5\nx + 3\n.exit\n' | ./funny vibe

      # ASan/UBSan (MSVC only has ASan -- see build.bat's own comment). The
      # corpus runs under them too: a use-after-free in the collector is
      # exactly the kind of thing that only shows up with real work to do.
      - name: Build (debug, sanitizers) and run the corpus under them
        if: runner.os != 'Windows'
        run: |
          set -eu
          ./build.sh debug
          ./funny --version
          ./funny test tests/lang

      - name: Build (debug, ASan) and run the corpus under it
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          build.bat debug || exit /b 1
          funny.exe --version || exit /b 1
          funny.exe test tests\lang || exit /b 1

      # The collector's own stress mode, at a period rather than at every
      # safepoint. `FUNNY_GC_STRESS=1` collects at *every* one, which is what
      # you want when hunting a specific missing root and is unusable across a
      # corpus: `funny test` compiles each golden with the self-hosted
      # compiler, so stress covers compilation as well as execution, and one
      # trivial golden goes from 0.005 s to 2.8 s. Measured over all 376:
      #
      #     no stress             8.6 s
      #     FUNNY_GC_STRESS=200  26.3 s
      #     FUNNY_GC_STRESS=50   80.8 s
      #     FUNNY_GC_STRESS=1    hours
      #
      # 50 still finds an unrooted object -- it only has to survive 50
      # safepoints to be collected out from under the C local holding it --
      # and covers the whole corpus rather than a chosen few.
      - name: The corpus under FUNNY_GC_STRESS
        if: matrix.os == 'ubuntu-latest' && matrix.cc == 'gcc'
        env:
          FUNNY_GC_STRESS: "50"
        run: |
          set -eu
          ./build.sh
          ./funny test tests/lang

      # ASYNC_PLAN.md A1/§5.5 and RUNTIME_PLAN.md R0: a data race is invisible
      # to ASan and to FUNNY_GC_STRESS alike -- it corrupts something quietly
      # and shows up much later, somewhere else. TSan is the only tool that
      # sees it, and `interns` runs real OS threads, so every golden that uses
      # them gets it: tests/lang/threads runs each stdlib module on eight
      # threads at once, and extensive_examples is where those modules meet a
      # real workload with sockets and TLS in it.
      #
      # Only these, and only on one matrix leg: TSan is slow, and the rest of
      # the corpus is single-threaded by construction, so running it there
      # would buy nothing for several minutes of CI.
      - name: The threaded goldens under ThreadSanitizer
        if: matrix.os == 'ubuntu-latest' && matrix.cc == 'clang'
        run: |
          set -eu
          SRCS=$(ls native/*.c | grep -v 'native/stub_main.c')
          clang -std=c11 -g -O1 -Wall -Wextra -Werror -pthread -fsanitize=thread \
              -o funny_tsan $SRCS -lm -ldl
          ./funny_tsan test tests/lang/threads
          ./funny_tsan test tests/lang/interns
          ./funny_tsan test tests/lang/async
          ./funny_tsan test extensive_examples

  no-python:
    # NATIVE_PLAN.md N9 task 3, and now N11's whole point made concrete: a
    # container with a C toolchain and *no interpreter*. No Python, no pip,
    # nothing that could be quietly doing the work. If this passes, "FunnyLang
    # needs no Python" is a fact about the artifact rather than a claim in a
    # README.
    #
    # It is "no interpreter", not "no libraries": `vault` gets its crypto from
    # the operating system and never implements a cipher, so it needs
    # libcrypto present the same way `https` does. See the install step.
    name: no-python (debian, cc only)
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 20

    env:
      FUNNY_NO_NET: "1"

    steps:
      - name: Install a C toolchain and no interpreter
        run: |
          apt-get update
          # git is for actions/checkout; on Debian it recommends perl, not
          # python, and --no-install-recommends keeps even that out.
          #
          # libssl3 provides libcrypto.so.3, which `vault` dlopen's for
          # password hashing and sealing. It is deliberately not vendored:
          # every platform ships a reviewed crypto library and FunnyLang
          # implements no cipher of its own, so the library has to be there.
          # Without it `vault` raises a clean SkillIssue -- which is correct
          # behaviour and documented, and also means tests/lang/stdlib's three
          # vault goldens, and the chat and HTTPS examples, cannot pass in a
          # container that lacks it. This is the crypto runtime, not an
          # interpreter, so the job still proves exactly what it is named for.
          apt-get install -y --no-install-recommends gcc libc6-dev ca-certificates git libssl3
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: Prove there is no Python here
        run: |
          set -eu
          for exe in python python3 python3.11 python3.12 pip pip3; do
            if command -v "$exe" >/dev/null 2>&1; then
              echo "FAIL: $exe is on PATH -- this job is meaningless with an interpreter available"
              exit 1
            fi
          done
          echo "no python, no pip."

      # Since N11 there should be nothing to find. Checked rather than
      # assumed: a `.py` creeping back in is exactly the kind of thing that
      # happens quietly.
      - name: Prove there is no .py in the repository either
        run: |
          set -eu
          if find . -name '*.py' | grep -q .; then
            echo "FAIL: a .py file is in the tree:"
            find . -name '*.py'
            exit 1
          fi
          echo "no .py files anywhere."

      - name: Build from C source alone
        run: ./build.sh

      - name: Everything the toolchain does
        run: |
          set -eu
          ./funny --version
          ./funny run examples/hello.funny
          ./funny run examples/modules/main.funny
          ./funny build examples/modules/main.funny -o built.funnypak
          ./funny run built.funnypak
          ./funny test tests/lang
          ./funny test tests/slow
          ./funny test examples
          ./funny test extensive_examples
          ./funny xray examples/hello.funny
          ./funny xray examples/hello.funny --ast
          ./funny fmt examples/fizzbuzz.funny --check
          ./funny bootstrap --verify

      - name: Yeet a standalone binary, then run it
        run: |
          set -eu
          ./funny yeet examples/hello.funny -o hello_standalone
          ./hello_standalone

      - name: The REPL
        run: printf 'yo x = 5\nx + 3\n.exit\n' | ./funny vibe

      # Belt and braces: rerun the sequence with an *empty environment* and no
      # PATH at all, which also rules out shelling out to anything.
      - name: Again, with no PATH at all
        run: |
          set -eu
          env -i FUNNY_NO_NET=1 ./funny --version
          env -i FUNNY_NO_NET=1 ./funny run examples/hello.funny
          env -i FUNNY_NO_NET=1 ./funny test tests/lang
          env -i FUNNY_NO_NET=1 ./funny bootstrap --verify

  regenerated-artifacts:
    # Two files in the tree are generated and checked in: the embedded
    # toolchain blob and the Unicode tables. A checked-in artifact is only
    # safe while something notices when it stops matching its sources, and
    # `tests/native/test_native_selfhost.py` used to be what noticed for the
    # blob -- in Python. This is the replacement, and it needs only the
    # binary that the blob is inside.
    name: generated artifacts are not stale
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./build.sh

      - name: The embedded toolchain matches selfhost/
        run: |
          set -eu
          ./funny build selfhost/cli.funny -o /tmp/cli.funnypak
          ./funny run tools/bin2c.funny /tmp/cli.funnypak /tmp/toolchain_blob.c toolchain_blob
          if ! cmp -s /tmp/toolchain_blob.c native/toolchain_blob.c; then
            echo "FAIL: native/toolchain_blob.c is stale -- selfhost/ changed without it being"
            echo "regenerated. See bootstrap/STAGE0.md."
            exit 1
          fi
          echo "toolchain_blob.c is current."

      # The Unicode tables are deliberately *not* checked here. Regenerating
      # them downloads UnicodeData.txt from unicode.org, so a CI job that did
      # it would go red when that host is slow, and would go red again the day
      # Unicode ships a release -- neither of which is a fault in this
      # repository. `tools/gen_unicode.funny` records its source URL in the
      # file it writes; regenerating is a deliberate act.
