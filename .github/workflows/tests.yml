name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # FunnyLang itself is stdlib-only, so pytest is the whole dependency list.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # `python -m pytest` (not bare `pytest`) so the repo root lands on
      # sys.path -- tests/test_cli.py shells out to `python -m funnylang`.
      - name: Run tests
        run: python -m pytest -q

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    # Everything below runs under bash on both runners so the smoke test is one
    # script rather than two dialects.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Exercises the real packaging path: pyproject metadata, the packages-find
      # config, and the `funny` console script landing on PATH.
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: funny --version
        run: funny --version

      # Runs every examples/*.funny that has a matching .expected and diffs the
      # output, via the installed script rather than `python -m funnylang`.
      - name: Run the example suite
        run: funny test examples

      # A .funnypak must resolve its own imports with no filesystem access, so
      # build the module tree and run it from a directory where the sources are
      # not reachable by relative import.
      - name: Build and run a linked .funnypak
        run: |
          mkdir -p pak-out
          funny build examples/modules/main.funny -o pak-out/main.funnypak
          cd pak-out
          funny run main.funnypak
